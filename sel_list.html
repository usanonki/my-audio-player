<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap"
      rel="stylesheet"
    />
    <title>나만의 음악 플레이어</title>

    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        color: #fff;
        margin: 0;
        padding: 40px;
        min-height: 100vh;
        background-image: url('https://usanonki.github.io/photo/foxbubble.gif');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        /* 스크롤바를 강제로 제거 */
        overflow: hidden;
      }

      /* 곡명 리스트 */
      .playlist {
        list-style: none;
        padding: 0;
        margin: 0;
        max-width: 180px;
      }

      /* 개별 곡 박스 */
      .playlist li {
        padding: 6px 12px; /* 위아래 여백을 최소화 (기존의 절반 이하) */
        margin: 4px 0; /* 박스 사이 간격을 촘촘하게 */
        background: rgba(
          0,
          0,
          0,
          0.3
        ); /* 배경을 조금 더 투명하게 해서 답답함 해소 */
        border-radius: 5px; /* 작은 크기에 어울리는 둥근 모서리 */
        font-size: 0.85em; /* 글자 크기를 작게 조절 */
        white-space: nowrap; /* 제목이 길어도 줄바꿈 되지 않도록 */
        overflow: hidden; /* 넘치는 글자 숨김 */
        text-overflow: ellipsis; /* 긴 제목 끝에 ... 표시 */
        transition: 0.2s;
      }

      .playlist li:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .playlist li.playing {
        background: #e92d78;
        font-weight: bold;
        opacity: 0.65;
      }

      /* 오디오 플레이어 위치 (원하는 대로 조정 가능) */
      /* 오디오 플레이어와 텍스트를 감싸는 컨테이너 */
      .audio-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column; /* 세로로 나열 */
        align-items: center; /* 가로축 중앙 정렬 */
        text-align: center;
        width: 100%; /* 텍스트가 넓어질 수 있도록 설정 */
      }

      audio {
        width: 300px;
        height: 22px;
      }

      .title-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: 6vh;
        color: #0c1a53;
        text-align: center;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 10%,
          rgba(248, 1, 1, 0.08),
          transparent 55%
        );
      }

      .title-main {
        font-family: 'Nanum Brush Script', cursive;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        letter-spacing: 0.12em;
        text-indent: 0.12em;
        text-shadow: 0 0 18px rgba(0, 0, 0, 0.7);
        animation: fadeIn 3s ease-out forwards;
        opacity: 0;
        /* 변경 가능 영역 */
        color: #202201; /* 메인 타이틀 색상 (예: 노란색) */
        margin-bottom: -10px; /* 3. 메인과 서브 사이의 간격 (마이너스 값으로 더 밀착 가능) */
      }

      .title-sub {
        font-family: 'Nanum Brush Script', cursive;
        margin-top: 0.6rem;
        font-size: clamp(1.2rem, 3vw, 2rem);
        opacity: 0.7;
        text-shadow: 0 0 10px rgba(15, 15, 15, 0.6);
        animation: fadeIn 4s ease-out forwards;
        opacity: 0;
        /* 변경 가능 영역 */
        color: #202201; /* 서브 타이틀 색상 (흰색) */
        margin-bottom: 15px; /* 3. 타이틀과 오디오 플레이어 사이의 간격 */
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px); /* 살짝 위로 올라오는 효과 추가 */
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <ul class="playlist">
      <li
        data-src="https://blog.kakaocdn.net/dn/bUJKGy/btsF2L8YeDU/140kFx6fzNKKV3kyaGHnf1/tfile.mp3"
      >
        Maggie의 추억
      </li>
      <li data-src="https://usanonki.github.io/music/night.mp3">
        밤의 길목에서
      </li>
      <li
        data-src="https://blog.kakaocdn.net/dn/Pr6LC/btrZznC2jTh/S9ioh19BgLjDA1TrA6lUC1/tfile.mp3"
      >
        Only You - The Platters
      </li>
    </ul>

    <div class="audio-container">
      <!-- 추가된 타이틀 -->
      <div class="title-main">세렌디피티</div>
      <div class="title-sub">마에스트라</div>
      <audio id="audioPlayer" controls></audio>
    </div>

    <script>
      const audio = document.getElementById('audioPlayer');
      const items = document.querySelectorAll('.playlist li');
      let currentIndex = 0; // 현재 재생 중인 인덱스 저장

      // 곡 재생 함수
      function playSong(index) {
        // 인덱스 범위 초과 방지 (마지막 곡이 끝나면 다시 처음으로)
        if (index >= items.length) index = 0;
        currentIndex = index;

        items.forEach((li) => li.classList.remove('playing'));
        const selected = items[index];
        selected.classList.add('playing');

        audio.src = selected.dataset.src;
        audio.play();
      }

      // 클릭 시 재생
      items.forEach((li, index) => {
        li.addEventListener('click', () => playSong(index));
      });

      // [추가된 부분] 한 곡이 끝나면 다음 인덱스 재생
      audio.addEventListener('ended', () => {
        playSong(currentIndex + 1);
      });

      // 첫 곡 자동 재생
      playSong(0);
    </script>
  </body>
</html>
