<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그리움이 머무는 곳</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #000;
      }

      /* 🌌 전체 장면(scene) */
      .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      /* 🌟 배경 이미지 */
      .background {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(1.25);
        z-index: 1;
      }

      /* ✨ mp4 효과 레이어 */
      .effect-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }

      .effect-layer video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.45;
        mix-blend-mode: screen;
        filter: brightness(1.05);
      }

      /* 🎵 오디오 (scene 내부 고정) */
      .audio-container {
        position: absolute;
        right: 20px;
        bottom: 5px;
        z-index: 10;
      }

      /* ✨ 텍스트 (우측 정렬 + 페이드인) */
      .overlay-text {
        position: absolute;
        right: 40px;
        bottom: 60px;
        z-index: 9;
        text-align: right;
        line-height: 1.1;
        animation: fadeIn 2.2s ease-out forwards;
        opacity: 0;
      }

      .overlay-text p {
        font-family: 'Nanum Brush Script', cursive;
        margin: 0;
        color: #ffffff;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
      }

      .text-large {
        font-size: 2.5em;
      }
      .text-medium {
        font-size: 1.5em;
      }
      .text-small {
        font-size: 1.3em;
      }

      /* ✒️ Maestra 서명 (Great Vibes) */
      .signature {
        position: absolute;
        right: 35px;
        bottom: 150px;
        font-family: 'Nanum Brush Script', cursive;
        font-size: 3.2em;
        color: rgba(220, 220, 220, 0.9);
        letter-spacing: 0.02em;
        z-index: 9;
        opacity: 0;
        animation: fadeIn 3s ease-out forwards;
        animation-delay: 1.2s;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      }

      /* ✨ 페이드인 */
      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="scene">
      <!-- 🌟 배경 이미지 -->
      <img
        src="https://64.media.tumblr.com/aae4f1789f277bb81f847552ff1af5b6/c6d3a14ef4cda142-d3/s540x810/0afd8e7c5374f17d8197ec0acc95ad9caa75e325.pnj"
        class="background"
      />

      <!-- ✨ mp4 효과 -->
      <div class="effect-layer">
        <video
          src="https://blog.kakaocdn.net/dn/b8te3R/btsHCuYLWlB/iULc2tv40kY1LiQww2Fnk1/tfile.mp4"
          autoplay
          loop
          muted
        ></video>
      </div>

      <!-- ✨ 텍스트 -->
      <div class="overlay-text">
        <p class="text-large">해피 데이</p>
        <p class="text-medium">그립고 그리운 사람</p>
        <p class="text-small">이 성국</p>
      </div>

      <!-- ✒️ Maestra 서명 -->
      <div class="signature">그리움이 머무는 곳</div>

      <!-- 🎵 오디오 -->
      <div class="audio-container">
        <audio
          id="mainAudio"
          style="
            border: 2.5px solid #5c8ebd;
            border-radius: 25px;
            width: 220px;
            height: 20px;
          "
          src="https://blog.kakaocdn.net/dn/tuOot/btsAySTu0k4/UKoj1giBvUp48ulmpbKgPk/tfile.mp3"
          controls
          autoplay
          loop
        ></audio>
      </div>
    </div>

    <script>
      const audio = document.getElementById('mainAudio');
      audio.volume = 0.3;

      document.body.addEventListener('click', () => audio.play(), {
        once: true,
      });
    </script>
  </body>
</html>
