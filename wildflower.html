<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>들꽃-유 익종</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap"
      rel="stylesheet"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ★ body 선언 하나로 통합 ★ */
      body {
        font-family: 'Playfair Display', serif;
        background:
          linear-gradient(
            90deg,
            rgba(88, 130, 29, 0.1),
            rgba(55, 95, 1, 0.1) 29%,
            transparent,
            transparent
          ),
          linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)),
          url('https://64.media.tumblr.com/1d63f626ab06e6f0dc413a8cdace51dd/203b5aab4b43940b-2a/s500x750/c28dff82f137ed98da25024cd49c151df87ef8a1.jpg')
            center/cover no-repeat;
        background-attachment: fixed;
        background-color: #dbb9a7;
        color: #f0e6d2;

        /* ★ 수정: flex column으로 변경 */
        display: flex;
        flex-direction: column;       /* 세로 방향으로 쌓기 */
        align-items: center;          /* 가로 중앙 유지 */
        justify-content: flex-start;  /* ← center 에서 변경: 위에서부터 배치 */

        min-height: 100vh;            /* ← height → min-height: 내용이 넘쳐도 됨 */
        overflow-y: auto;             /* ← hidden → auto: 잘리지 않음 */

        margin: 0;
        padding: 0;
        position: relative;
      }

      .container {
        width: 90%;
        max-width: 850px;
        text-align: center;
        z-index: 2;

        /* ★ flex column으로 내부 요소 순서 제어 */
        display: flex;
        flex-direction: column;
        align-items: center;
        
        min-height: 100vh;            /* body 전체 높이 차지 */
        padding: 40px 0 0 0;          /* 상단 여백 */
      }

      h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.1rem, 3vw, 2.1rem);
        margin-bottom: 5px;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      .subtitle {
        font-size: clamp(0.7rem, 2vw, 1.3rem);
        margin-bottom: 50px;
        opacity: 0.9;
        letter-spacing: 2px;
      }

      /* 텍스트 박스 영역: 남은 공간 차지 */
      .text-wrapper {
        position: relative;
        width: 100%;
        min-height: 180px;
        flex: 1;                      /* 남은 공간을 모두 차지해서 오디오를 아래로 밀어냄 */
      }

      .text-box {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        font-size: clamp(0.8rem, 1.8vw, 1.5rem);
        line-height: 1.9;
        padding: 30px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(3px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        opacity: 0;
        transform: translateY(20px);
        transition: all 1.5s ease;
        display: none;
      }

      .text-box.active {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }

      /* ★ 오디오: position:absolute 완전 제거, margin-top:auto 로 하단 고정 */
      .audio-container {
        display: flex;
        justify-content: center;
        width: 100%;

        margin-top: auto;             /* ← 핵심: 위 공간을 자동으로 밀어내어 항상 하단으로 */
        margin-bottom: 10px;

        z-index: 10;
        opacity: 0.6;
        transition: opacity 0.3s;
      }

      .audio-container:hover {
        opacity: 1;
      }

      audio {
        border: 2.5px solid #6d594d;
        border-radius: 25px;
        width: 220px;
        height: 20px;
      }

      /* footer: 오디오 바로 아래, 항상 맨 아래 */
      .footer {
        padding-bottom: 20px;
        font-size: 0.95rem;
        opacity: 0.7;
        text-align: center;
        line-height: 1.6;
      }

      .overlay {
        position: fixed;              /* ← absolute → fixed: 스크롤해도 배경 유지 */
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          circle,
          transparent 40%,
          rgba(0, 0, 0, 0.3) 100%
        );
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="overlay"></div>

    <div class="container">
      <h1>들꽃</h1>
      <p class="subtitle">유 익종</p>

      <div class="text-wrapper">
        <div id="text1" class="text-box active">
          <p>
            유익종의 '들꽃' 한 소절이<br />
            부드러운 바람을 타고 오월의 첫 주말을 살며시 열어줍니다.
          </p>
        </div>

        <div id="text2" class="text-box">
          <p>
            가장 소중한 사람에게<br />
            들꽃 한 송이를 조심스레 건네는 마음으로 인사를 드립니다.
          </p>
        </div>

        <div id="text3" class="text-box">
          <p>
            화려하지 않아도 오래 기억되는 향기처럼,<br />
            소중한 분들과 따뜻하게 어우러지는 오월이 되세요.
          </p>
        </div>

        <div id="text4" class="text-box">
          <p>
            들꽃은 심지 않아도 아름답게 피어나듯,<br />
            당신의 일상에도 뜻하지 않은 기쁨이 가득하길 바랍니다.
          </p>
        </div>
      </div>

      <!-- 오디오: footer 바로 위 -->
      <div class="audio-container">
        <audio
          id="mainAudio"
          src="https://blog.kakaocdn.net/dn/2qL8P/btriWLkxznh/Xc3cP2OzHC8wQEpT9qawIK/tfile.mp3"
          controls
          autoplay
          loop
        ></audio>
      </div>

      <div class="footer">
        Happy Day<br />
        <small>© Maestra</small>
      </div>
    </div>

    <script>
      const boxes = [
        document.getElementById('text1'),
        document.getElementById('text2'),
        document.getElementById('text3'),
        document.getElementById('text4'),
      ];

      let currentIndex = 0;

      function showNextText() {
        boxes[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % boxes.length;

        setTimeout(() => {
          boxes.forEach((box) => (box.style.display = 'none'));
          boxes[currentIndex].style.display = 'block';
          setTimeout(() => {
            boxes[currentIndex].classList.add('active');
          }, 50);
        }, 1500);
      }

      setInterval(showNextText, 15000);
    </script>
  </body>
</html>
