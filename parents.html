<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>어버이날 감사합니다</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;

        background: #000;

        font-family: 'Noto Serif KR', serif;
      }

      body {
        transform: translateZ(0);
      }

      .scene {
        position: relative;

        width: 100%;
        height: 100vh;

        overflow: hidden;

        background: #000;

        transform: translateZ(0);

        will-change: opacity;
      }

      /* =========================
         VIDEO LAYER
      ========================= */

      .video-item {
        position: absolute;
        inset: 0;

        opacity: 0;

        transition: opacity 4s ease-in-out;

        will-change: opacity;
      }

      .video-item.active {
        opacity: 1;
      }

      video {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        filter: brightness(0.82);

        backface-visibility: hidden;

        transform: translateZ(0);
      }

      /* =========================
         GRADIENT
      ========================= */

      .gradient {
        position: absolute;
        inset: 0;

        pointer-events: none;
      }

      .gradient1 {
        background: linear-gradient(
          90deg,
          #f2cad6,
          #f7d4de 16%,
          transparent,
          transparent
        );
      }

      .gradient2 {
        background: linear-gradient(
          90deg,
          #fbe3e4,
          #fea4a6 17%,
          transparent,
          transparent
        );
      }

      .gradient3 {
        background: linear-gradient(
          90deg,
          #facecd,
          #fea4a6 17%,
          transparent,
          transparent
        );
      }

      .gradient4 {
        background: linear-gradient(
          90deg,
          #f2cad6,
          #f7d4de 29%,
          transparent,
          transparent
        );
      }

      /* =========================
         DARK OVERLAY
      ========================= */

      .overlay {
        position: absolute;
        inset: 0;

        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.45)
        );

        z-index: 3;

        pointer-events: none;
      }

      /* =========================
         MESSAGE
      ========================= */

      .message-wrap {
        position: absolute;
        inset: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 8vw;

        z-index: 10;
      }

      .message {
        position: absolute;

        width: 90%;
        max-width: 1000px;

        opacity: 0;

        transform: translateY(30px);

        transition:
          opacity 2.5s ease,
          transform 2.5s ease;

        color: #fff;

        text-shadow:
          0 0 10px rgba(0, 0, 0, 0.5),
          0 0 20px rgba(0, 0, 0, 0.3);

        line-height: 1.9;

        letter-spacing: 0.05em;
      }

      .message.show {
        opacity: 1;
        transform: translateY(0);
      }

      .message p {
        font-size: clamp(1rem, 1.5vw, 2rem);

        font-weight: 300;
      }

      .message strong {
        display: block;

        margin-top: 0.7em;

        font-size: clamp(1.3rem, 2.2vw, 3rem);

        font-weight: 600;
      }

      /* =========================
         AUDIO
      ========================= */

      /* 오디오 플레이어 */
      .audio-box {
        position: absolute;

        left: 1.2rem;
        bottom: 1.2rem;

        z-index: 20;

        backdrop-filter: blur(8px);
      }

      audio {
        width: clamp(150px, 14vw, 220px);
        height: 25px;
        border: 2.5px solid #f0644b;
        border-radius: 25px;
      }

      /* =========================
         FOOTER
      ========================= */

      .footer {
        margin-top: 10px;

        color: rgba(255, 255, 255, 0.78);

        font-size: clamp(0.55rem, 0.7vw, 0.85rem);

        line-height: 1.5;

        text-align: center;

        letter-spacing: 0.08em;

        opacity: 0.75;

        text-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
      }

      .footer small {
        display: block;

        margin-top: 2px;

        font-size: clamp(0.5rem, 0.6vw, 0.72rem);

        opacity: 0.7;
      }

      /* =========================
         MOBILE
      ========================= */

      @media (max-width: 768px) {
        .message p {
          font-size: clamp(0.95rem, 3vw, 1.4rem);
        }

        .message strong {
          font-size: clamp(1.2rem, 4vw, 2rem);
        }

        audio {
          width: 180px;
        }
      }
    </style>
  </head>

  <body>
    <div class="scene">
      <!-- =========================
           VIDEO 1
      ========================== -->

      <div class="video-item active">
        <video autoplay muted loop playsinline>
          <source
            src="https://va.media.tumblr.com/tumblr_teog3zAg511b09833.mp4"
          />
        </video>

        <div class="gradient gradient1"></div>
      </div>

      <!-- =========================
           VIDEO 2
      ========================== -->

      <div class="video-item">
        <video autoplay muted loop playsinline>
          <source
            src="https://va.media.tumblr.com/tumblr_teogm98EH01b09833.mp4"
            type="video/mp4"
          />
        </video>

        <div class="gradient gradient2"></div>
      </div>

      <!-- =========================
           VIDEO 3
      ========================== -->

      <div class="video-item">
        <video autoplay muted loop playsinline>
          <source
            src="https://va.media.tumblr.com/tumblr_teogsqFhpb1b09833_720.mp4"
            type="video/mp4"
          />
        </video>

        <div class="gradient gradient3"></div>
      </div>

      <!-- =========================
           VIDEO 4
      ========================== -->

      <div class="video-item">
        <video autoplay muted loop playsinline>
          <source
            src="https://va.media.tumblr.com/tumblr_teogw9RT6w1b09833.mp4"
            type="video/mp4"
          />
        </video>

        <div class="gradient gradient4"></div>
      </div>

      <!-- 어두운 오버레이 -->
      <div class="overlay"></div>

      <!-- =========================
           TEXT MESSAGE
      ========================== -->

      <div class="message-wrap">
        <!-- MESSAGE 1 -->
        <div class="message msg1 show">
          <p>
            언제나 같은 자리에서<br />
            묵묵히 우리를 지켜주시던
          </p>

          <strong>
            부모님의 따뜻한 사랑에<br />
            오늘도 깊이 감사드립니다
          </strong>
        </div>

        <!-- MESSAGE 2 -->
        <div class="message msg2">
          <p>
            힘겨운 날에도 먼저 웃어주시고<br />
            지친 마음을 안아주시던
          </p>

          <strong>
            그 커다란 품이 있었기에<br />
            오늘의 우리가 있습니다
          </strong>
        </div>

        <!-- MESSAGE 3 -->
        <div class="message msg3">
          <p>
            사랑한다는 말보다 더 깊은<br />
            부모님의 긴 시간의 희생
          </p>

          <strong>
            어버이날을 맞아<br />
            진심으로 존경하고 사랑합니다
          </strong>
        </div>
      </div>

      <!-- =========================
           AUDIO
      ========================== -->

      <div class="audio-box">
        <audio id="bgm" controls autoplay loop>
          <source
            src="https://blog.kakaocdn.net/dna/ctfGU8/dJMcajhOqjA/AAAAAAAAAAAAAAAAAAAAAHbYKF_ZxCTkOiaw_aVXYEu6RWscsOBp9I1mTMgOZ4Qk/tfile.mp3?credential=yqXZFxpELC7KVnFOS48ylbz2pIh7yKj8&expires=1780239599&allow_ip=&allow_referer=&signature=hw%2FPLbx1eTr48lSpJK4ZVJGt6LI%3D"
            type="audio/mpeg"
          />
        </audio>

        <div class="footer">
          Beautiful Melody for Your Soul<br />
          <small>© Maestra</small>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener('load', () => {
        /* =========================
           VIDEO FADE
        ========================= */

        const videos = document.querySelectorAll('.video-item');

        let currentVideo = 0;

        setInterval(() => {
          videos[currentVideo].classList.remove('active');

          currentVideo = (currentVideo + 1) % videos.length;

          videos[currentVideo].classList.add('active');
        }, 15000);

        /* =========================
           MESSAGE FADE
        ========================= */

        const messages = [
          document.querySelector('.msg1'),
          document.querySelector('.msg2'),
          document.querySelector('.msg3'),
        ];

        let currentMsg = 0;

        setInterval(() => {
          messages[currentMsg].classList.remove('show');

          currentMsg = (currentMsg + 1) % messages.length;

          messages[currentMsg].classList.add('show');
        }, 20000);

        /* =========================
           AUDIO PLAY
        ========================= */

        const audio = document.getElementById('bgm');

        const playAudio = () => {
          audio.play().catch(() => {});
        };

        playAudio();

        document.addEventListener('click', playAudio, { once: true });
      });
    </script>
  </body>
</html>
