<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♪Rain Rain♬</title>
<style>
  /* 1. 배경 설정 (기존 유지) */
  body {
    margin: 0;
    padding: 0;
    background-image:
      linear-gradient(90deg, #B8C1D4 0%, #B0C0D1 33%, transparent, transparent),
      url('https://usanonki.github.io/photo/smallspot.gif'),
      url('https://usanonki.github.io/photo/jh013.jpg');
    background-attachment: fixed;
    background-color: #A5B9D1;
    background-repeat: no-repeat;
    background-position: right bottom, right 110px bottom -15px, right bottom;
    background-size: 100% 100%, 750px 650px, 67% 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 2. 영상 영역 */
  .video-container {
    width: 768px;
    height: 432px;
    background: #000;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    overflow: hidden;
    z-index: 5;
    margin-bottom: 50px;
  }

  .ql-video {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* 3. 음악 정보 텍스트 */
  .music-info {
    position: fixed;
    left: 9px;
    right: auto;
    bottom: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 26px;
    min-width: 250px;
    padding: 0 15px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.3); 
    border: 1px solid rgba(71, 85, 105, 0.3);
    color: #334155;
    border-radius: 30px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-weight: 600;
    font-size: 0.75em;
    letter-spacing: -0.01em;
    z-index: 101;
    white-space: nowrap;
  }

  /* 4. 오디오 플레이어 상자 (수정됨) */
  .audio-wrapper {
    position: fixed;
    left: 9px;
    bottom: 8px;
    width: 600px !important;
    max-width: 95% !important;
    height: 30px;
    display: flex !important;
    align-items: center;
    justify-content: center;
    padding: 0 2px !important; /* 좌우 균형 */
    box-sizing: border-box;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(71, 85, 105, 0.12);
    backdrop-filter: blur(10px) brightness(1.05);
    -webkit-backdrop-filter: blur(12px) brightness(1.1);
    z-index: 100;
    overflow: hidden;
  }

  /* 내부 플레이어 태그 설정 (수정됨) */
  .bgm-player {
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important; /* 좌우 여백 제거 */
    filter: grayscale(1) contrast(0.9) opacity(0.8) invert(0.1);
    outline: none;
  }

  /* 브라우저 기본 컨트롤러를 사용하는 경우 여백 제거 */
  .audio-wrapper audio {
    width: 100%;
    height: 28px;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }

  /* 5. 내부 요소 크기 조절 (중괄호 오류 수정) */
  .audio-wrapper input[type="range"] {
    transform: scale(0.85);
  }
</style>



    
  </head>
  <body>
    <!-- 음악 정보 -->
    <div class="music-info">
      🎹 "Sergey Grischuk - Rain Rain " ♪♬
    </div>

    <!-- 오디오 플레이어 -->
    <div class="audio-wrapper">
      <audio class="bgm-player" controls autoplay loop>
        <source
          src="https://blog.kakaocdn.net/dn/cGszoY/btsIfeBLSkE/GcKiHgFHwil0podXKiqTjK/tfile.mp3"
          type="audio/mpeg"
        />
        브라우저가 오디오를 지원하지 않습니다.
      </audio>
    </div>

    <script>
      window.addEventListener(
        'click',
        () => {
          const audio = document.querySelector('audio');
          if (audio.paused) {
            audio.play();
          }
        },
        { once: true },
      );
    </script>
  </body>
</html>
