<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♪Rain Rain♬</title>
    <style>
      /* 1. 배경 설정 (기존 유지하되 색상 최적화) */
      body {
        margin: 0;
        padding: 0;
        background-image:
          linear-gradient(
            90deg,
            #B8C1D4 0%,
            #B0C0D1 33%,                
            transparent, 
            transparent
          ),
          url('https://usanonki.github.io/photo/smallspot.gif'),
          url('https://usanonki.github.io/photo/jh013.jpg');
        background-attachment: fixed;
        background-color: #A5B9D1;
        background-repeat: no-repeat;
        background-position:
          right bottom,
          right 110px bottom -15px,
          right bottom;
        background-size:
          100% 100%,
          750px 650px,
          67% 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 2. 영상 영역 */
      .video-container {
        width: 768px;
        height: 432px;
        background: #000;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        overflow: hidden;
        z-index: 5;
        margin-bottom: 50px; /* 아래 요소와 겹치지 않게 여백 */
      }

      .ql-video {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* 3. 음악 정보 텍스트 - 청회색 테마 적용 */
      .music-info {
        position: fixed;
        right: 9px;
        bottom: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 26px;
        min-width: 250px;
        padding: 0 15px;
        box-sizing: border-box;
        /* 배경: 아주 투명한 화이트로 배경 청회색을 비춤 */
        background: rgba(255, 255, 255, 0.3); 
        /* 테두리: 배경보다 살짝 짙은 청회색 */
        border: 1px solid rgba(71, 85, 105, 0.3);
        /* 글자색: 깊이 있는 다크 블루그레이 */
        color: #334155;
        border-radius: 30px;
        backdrop-filter: blur(12px); /* 블러 강도를 높여 고급스럽게 */
        -webkit-backdrop-filter: blur(12px);
        font-weight: 600;
        font-size: 0.75em;
        letter-spacing: -0.02em;
        z-index: 101;
        white-space: nowrap;
      }

      /* 4. 오디오 플레이어 상자 - 통일감 있는 디자인 */
      .audio-wrapper {
        position: fixed;
        right: 9px;
        bottom: 8px;
        width: 450px;
        height: 26px;
        display: flex;
        align-items: center;
        padding: 0 8px;
        box-sizing: border-box;
        /* info와 동일한 재질감 부여 */
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(71, 85, 105, 0.2);
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 100;
      }

      .bgm-player {
        width: 100%;
        height: 24px;
        filter: grayscale(1) contrast(0.8) opacity(0.7); /* 플레이어 자체 색상을 배경에 묻히게 조정 */
      }
    </style>
    
  </head>
  <body>
    <!-- 음악 정보 -->
    <div class="music-info">
      🎹 "Sergey Grischuk - Rain Rain " ♪♬
    </div>

    <!-- 오디오 플레이어 -->
    <div class="audio-wrapper">
      <audio class="bgm-player" controls autoplay loop>
        <source
          src="https://blog.kakaocdn.net/dn/cGszoY/btsIfeBLSkE/GcKiHgFHwil0podXKiqTjK/tfile.mp3"
          type="audio/mpeg"
        />
        브라우저가 오디오를 지원하지 않습니다.
      </audio>
    </div>

    <script>
      window.addEventListener(
        'click',
        () => {
          const audio = document.querySelector('audio');
          if (audio.paused) {
            audio.play();
          }
        },
        { once: true },
      );
    </script>
  </body>
</html>
