<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음악 재생 페이지</title>
    <!-- 제공해주신 외부 스타일시트 -->
    <link rel="stylesheet" href="//artworld.ai.kr/css/goodcafe.php?color=82A0C1">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 1280x720 배경 이미지 설정 */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://64.media.tumblr.com/28867a32d780b20b660ce3675da7ce64/6bf8b3d44d7b9328-16/s540x810/8840596c9b66af172f43f3d3cd56221b00af2398.gifv');
            background-size: cover;    /* 화면에 꽉 차게 조절 */
            background-position: center; /* 이미지 중앙 정렬 */
            z-index: -1;               /* 재생기보다 뒤에 위치 */
        }

        /* 재생기 위치 중앙 정렬 */
        .player-container {
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 하단 배치 */
            height: 100vh;
            padding-bottom: 30px; /* 하단 여백 살짝 줄임 */
            box-sizing: border-box;align-items: center;
           
        }

        audio {
            /* 가로 길이는 800px로 넓게 설정 */
            width: 800px; 
            
            /* 전체 크기를 0.5배(50%)로 축소 */
            /* 축소하면 가로 800px이 400px처럼 보일 수 있으므로, 
               실제 체감 길이를 위해 scale과 width를 조합했습니다. */
            transform: scale(0.6); 
            transform-origin: bottom center;
            
            opacity: 0.7; /* 배경과 잘 어우러지도록 살짝 투명하게 */
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>

    <!-- 배경 이미지 레이어 -->
    <div class="background"></div>

    <!-- 오디오 재생기 -->
    <div class="player-container">
        <audio src="https://usanonki.github.io/music/leaving.mp3" 
               autoplay 
               loop 
               controls>
        </audio>
    </div>

</body>
</html>
