<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>16:9 나는 당신께~~~~</title>
    <style>
        .ql-align-center {
            display: block;
            margin: 20px auto; /* 위아래 여백 20px, 좌우 자동 중앙 */
        }

        .ql-video-container {
            width: 100%;
            max-width: 900px; /* 가로 크기를 조금 더 키웠습니다 */
            aspect-ratio: 16 / 9; /* 가로 16 : 세로 9 표준 비율 */
            background-color: #000;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .ql-video {
            width: 100%;
            height: 100%;
            /* 'contain'은 영상 전체를 보여주되 틀에 맞춤, 
               'cover'는 여백 없이 꽉 채움 (약간 잘릴 수 있음) */
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <div class="ql-video-container ql-align-center">
        <video class="ql-video" 
               controls 
               playsinline 
               autoplay 
               muted>
            <source src="https://va.media.tumblr.com/tumblr_tcbo7524jz1b09833_720.mp4">
            브라우저가 비디오를 지원하지 않습니다.
        </video>
    </div>

</body>
</html>
