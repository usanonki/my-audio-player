<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나는 당신께~~~~</title>
    <style>
        /* ql-align-center 클래스를 위한 중앙 정렬 스타일 */
        .ql-align-center {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        /* 영상 크기 조절 (선택 사항) */
        .ql-video {
            width: 720px;
            height: 1280px;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <!-- 요청하신 조건이 포함된 iframe 태그 -->
    <iframe class="ql-video ql-align-center" 
            src="https://va.media.tumblr.com" 
            frameborder="0" 
            allowfullscreen="true">
    </iframe>

</body>
</html>
