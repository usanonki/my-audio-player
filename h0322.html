<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>la vida es bella</title>
    <!-- 제공해주신 외부 스타일시트 -->
    <link rel="stylesheet" href="//artworld.ai.kr/css/goodcafe.php?color=82A0C1">
   <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* 1280x720 배경 이미지 */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://64.media.tumblr.com/28867a32d780b20b660ce3675da7ce64/6bf8b3d44d7b9328-16/s540x810/8840596c9b66af172f43f3d3cd56221b00af2398.gifv');
            background-size: cover;
            z-index: 1;
        }

        /* 오디오 재생기 설정 */
        audio {
            position: absolute;
            bottom: 30px;        /* 하단 여백 */
            left: 50%;           /* 가로 중앙 정렬을 위한 시작점 */
            transform: translateX(-50%) scaleY(0.7); /* 중앙 정렬 + 세로 높이 슬림하게 축소 */
            
            width: 600px;        /* 가로 너비 800px */
            height: 25px;        /* 기본 높이를 낮게 설정 */
            
            z-index: 10;         /* 이미지보다 앞에 위치 */
            opacity: 0.9;        /* 항상 선명하게 보이도록 설정 */
            outline: none;
        }
    </style>
</head>
<body>

    <!-- 배경 이미지 레이어 -->
    <div class="background"></div>

    <!-- 오디오 재생기 -->
    <div class="player-container">
        <audio src="https://usanonki.github.io/music/h0322.mp3" autoplay loop controls>
        </audio>
    </div>

</body>
</html>
