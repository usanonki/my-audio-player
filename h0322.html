<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나는 당신께~~~~</title>
    <style>
        /* 중앙 정렬 및 비디오 스타일 */
        .ql-align-center {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .ql-video-container {
            width: 100%;
            max-width: 500px; /* 원하는 가로 크기로 조절하세요 */
            aspect-ratio: 9 / 16; /* 세로형 영상 비율에 맞춤 (가로형이면 16/9) */
            background-color: #000; /* 혹시 모를 여백 대비 배경색 */
            overflow: hidden;
            border-radius: 8px; /* 모서리 부드럽게 (선택 사항) */
        }

        .ql-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 영상이 틀에 꽉 차도록 설정 (여백 제거 핵심) */
        }
    </style>
</head>
<body>

    <div class="ql-video-container ql-align-center">
        <!-- 원본 MP4 주소를 직접 연결한 video 태그 -->
        <video class="ql-video" 
               controls 
               playsinline 
               loop 
               muted 
               autoplay>
            <source src="https://va.media.tumblr.com/tumblr_tcbo7524jz1b09833_720.mp4">
            브라우저가 비디오 태그를 지원하지 않습니다.
        </video>
    </div>

</body>
</html>
