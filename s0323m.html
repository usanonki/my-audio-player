<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>이미지 위 글자 넣기 - star효과 (반응형 축소)</title>

    <!-- 구글 폰트 감자꽃 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ================================
         0. 전체를 감싸는 반응형 축소 박스
      ================================= */
      .scale-wrapper {
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* ================================
         1. 원본 레이아웃 (1280x720 유지)
      ================================= */
      .main-container {
        position: relative;
        width: 768px;
        height: 432px;

        background-color: #ffffff; /* 흰색 배경 */
        background-blend-mode: soft-light;

        overflow: hidden;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;

        transform-origin: top left; /* 축소 기준점 */
      }

      /* ================================
         2. 이미지 + 별 + 글자 그룹
      ================================= */
      .image-wrapper {
        position: relative;
        width: 320px;
        height: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .bg-png {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .star-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        background-image: url('https://usanonki.github.io/photo/star.gif');
        background-size: cover;
        pointer-events: none;
      }

      .text-overlay {
        position: absolute;
        top: 40%;
        left: 35%;
        transform: translate(-50%, -50%);
        z-index: 3;
        color: #444;
        font-family: 'Gamja Flower', sans-serif;
        line-height: 0.9;
        font-size: 45px;
        font-weight: bold;
        text-align: center;
        white-space: normal;
        text-shadow: 0 0 15px rgba(255, 255, 255, 1);
      }

      .text-overlay .title {
        font-size: 40px;
        font-weight: 900;
        display: block;
        margin-bottom: 2px;
      }

      .text-overlay .sub {
        font-size: 20px;
        opacity: 0.8;
        display: block;
      }

      .text-overlay .name {
        font-size: 14px;
        color: #888;
        display: block;
        margin-top: -8px;
      }

      .audio-player {
        position: absolute;
        /* 1. 위치 조정: right를 늘려 왼쪽으로 이동, bottom으로 높이 조절 */
        right: 20px;
        bottom: 15px;
        width: 250px;  /* 너비를 더 줄임 (기존 250px) */
        height: 30px;  /* 컨트롤바가 잘리지 않는 최소 높이 */
        transform: scale(0.75); /* 전체적으로 75% 크기로 축소 (글자도 같이 작아짐) */
        transform-origin: right bottom; /* 오른쪽 아래를 기준으로 축소하여 위치 고정 */
        
        z-index: 5;
        opacity: 0.7;
      }

      /* ================================
         3. 화면이 1280px보다 작아지면 자동 축소
      ================================= */
      @media screen and (max-width: 1280px) {
        .scale-wrapper {
          --scale: calc(100vw / 1280);
        }
        .main-container {
          transform: scale(var(--scale));
        }
      }
    </style>
  </head>

  <body>
    <div class="scale-wrapper">
      <div class="main-container">
        <div class="image-wrapper">
          <img src="https://usanonki.github.io/photo/jh01m.png" class="bg-png" />

          <div class="star-layer"></div>

          <div class="text-overlay">
            <span class="title">유리창엔 비</span><br />
            <span class="sub">Acoustic Ver</span><br />
            <span class="name">이햇사레cover</span>
          </div>

          <audio
            id="myAudio"
            class="audio-player"
            src="https://usanonki.github.io/music/rain.mp3"
            controls
            autoplay
            loop
          ></audio>
        </div>
      </div>
    </div>
  </body>
</html>
