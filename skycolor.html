<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하늘색 꿈</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      }

      /* 🌟 GIF 배경 */
      body {
        background: url('https://64.media.tumblr.com/539b03615da945ce0041fe66a7d1ff40/326840f91cda9c84-02/s540x810/c2b529a71270d757914e9c47e261d13c4e113bfa.jpg')
          no-repeat center center fixed;
        background-size: cover;
      }

      /* ✨ mp4 효과 레이어 */
      .effect-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
      }

      .effect-layer video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;

        opacity: 0.75;
        mix-blend-mode: screen;
        filter: brightness(1.3);
      }

      /* 🎵 오디오 */
      .audio-fixed-container {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 10000;
      }

      /* ✨ 텍스트 영역 (우측 정렬 + 라인 간격 + 페이드인) */
      .overlay-text {
        position: fixed;
        right: 40px; /* ← 우측 여백 조절 */
        bottom: 70px; /* ← 텍스트 전체 위치 위로 올림 */
        z-index: 9999;
        text-align: right; /* ← 우측 정렬 */
        line-height: 1.25; /* ← 라인 간격 조절 */
        animation: fadeIn 2.2s ease-out forwards;
        opacity: 0;
      }

      /* 텍스트 스타일 */
      .overlay-text p {
        font-family: 'Nanum Brush Script', cursive;
        margin: 0;
        color: #ffffff;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
      }

      /* 크기 개별 조절 */
      .text-large {
        font-size: 4.2em;
      }

      .text-medium {
        font-size: 2.2em;
      }

      .text-small {
        font-size: 1.9em;
      }

      /* ✨ 페이드인 애니메이션 */
      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="effect-layer">
      <video
        src="https://blog.kakaocdn.net/dn/b8te3R/btsHCuYLWlB/iULc2tv40kY1LiQww2Fnk1/tfile.mp4"
        autoplay
        loop
        muted
      ></video>

      <video src="" autoplay loop muted></video>
    </div>

    <div class="audio-fixed-container">
      <audio
        id="mainAudio"
        style="
          border: 2.5px solid #5c8ebd;
          border-radius: 25px;
          width: 250px;
          height: 30px;
        "
        src="https://usanonki.github.io/music/sky.mp3"
        controls
        autoplay
        loop
      ></audio>
    </div>

    <!-- ✨ 텍스트 (페이드인 + 라인 간격 + 우측 정렬) -->
    <div class="overlay-text">
      <p class="text-large">해피 데이</p>
      <p class="text-medium">하늘색 꿈</p>
      <p class="text-small">박 지윤</p>
    </div>

    <script>
      const audio = document.getElementById('mainAudio');
      audio.volume = 0.3;

      document.body.addEventListener(
        'click',
        function () {
          audio.play();
        },
        { once: true },
      );
    </script>
  </body>
</html>
