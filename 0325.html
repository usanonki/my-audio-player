<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>너의 의미</title>
     <style>
      /* 1. 배경 설정 */
      body {
        margin: 0;
        padding: 0;
        background-image:
          linear-gradient(90deg, #edf3e5, #dbe7ce 33%, transparent, transparent),
          url('https://usanonki.github.io/photo/bubble.gif'), 
          url('https://usanonki.github.io/photo/siyeon01.gif');
        background-attachment: fixed;
        background-color: #e4d363;
        background-repeat: no-repeat;
        background-position: right bottom, right 110px bottom -15px, right bottom;
        background-size: 100% 100%, 750px 650px, 67% 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
      }
     
      /* 3. 음악 정보 텍스트 (위치 및 수직 정렬 최적화) */
      .music-info {
        position: fixed;
        right: 5px;
        bottom: 45px; /* 플레이어 박스(36px) + 바닥(8px) + 간격(8px) */
        display: flex;
        align-items: center;
        justify-content: center;
        height: 25px;
        min-width: 250px;
        padding: 0 15px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.5);
        border: 1.5px solid #b8c9a7; 
        border-radius: 30px;
        backdrop-filter: blur(8px);
        color: #4a5c31;
        font-weight: bold;
        font-size: 0.80em;
        z-index: 101;
        white-space: nowrap;
      }

      /* 4. 오디오 플레이어 감싸는 상자 */
      .audio-wrapper {
        position: fixed;
        right: 5px;
        bottom: 5px;
        width: 250px;
        height: 32px;
        display: flex;
        align-items: center;
        padding: 0 5px;
        box-sizing: border-box;
        background: rgba(219, 231, 206, 0.7);
        border: 1.5px solid #b8c9a7;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(74, 92, 49, 0.3); 
        backdrop-filter: blur(5px);
        z-index: 100;
      }

      .bgm-player {
        width: 100%;
        height: 20px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <!-- 음악 정보 표시 -->
    <div class="music-info">♬ IU(아이유) - 너의 의미 (Feat 김 창완) ♬</div>

    <!-- 오디오 레이어 (자동 재생 및 반복 설정) -->
    <audio controls autoplay loop>
      <source
        src="http://a.tumblr.com/tumblr_ppdua8HFO61xuzllbo1.mp3"
        type="audio/mpeg"
      />
      브라우저가 오디오를 지원하지 않습니다.
    </audio>

    <script>
      // 최근 브라우저는 사용자 클릭 없이 소리가 안 날 수 있어 안내 팝업을 띄울 수 있습니다.
      window.addEventListener(
        'click',
        () => {
          const audio = document.querySelector('audio');
          if (audio.paused) {
            audio.play();
          }
        },
        { once: true },
      );
    </script>
  </body>
</html>
