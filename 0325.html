<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>너의 의미</title>
     <style>
      /* 1. 배경 설정 */
      body {
        margin: 0;
        padding: 0;
        background-image:
          linear-gradient(90deg, #edf3e5, #dbe7ce 33%, transparent, transparent),
          url('https://usanonki.github.io/photo/bubble.gif'), 
          url('https://usanonki.github.io/photo/siyeon01.gif');
        background-attachment: fixed;
        background-color: #e4d363;
        background-repeat: no-repeat;
        background-position: right bottom, right 110px bottom -15px, right bottom;
        background-size: 100% 100%, 750px 650px, 67% 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
      }
     
      /* 3. 음악 정보 텍스트 (위치 및 수직 정렬 최적화) */
      .music-info {
        position: fixed; /* 화면에 고정 */
        left: 13px; /* 오른쪽에서 20px 띄움 */
        bottom: 40px; /* 바닥에서 70px 띄움 (오디오 플레이어 높이만큼 확보) */

        padding: 5px 10px;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        border-radius: 30px;
        color: #4a5c31;
        font-weight: bold;
        font-size: 0.9em;
        z-index: 100; /* 다른 요소보다 위에 보이게 설정 */
        white-space: nowrap; /* 텍스트 줄바꿈 방지 */
      }

      /* 4. 오디오 플레이어 감싸는 상자 */
      audio {
        position: fixed; /* 화면에 고정 */
        left: 13px; /* 오른쪽에서 20px 띄움 */
        bottom: 8px; /* 바닥에서 20px 띄움 */
        padding: 5px 5px;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        border-radius: 30px;
        color: #4a5c31;
        height: 20px; /* 플레이어 높이 */
        width: 350px; /* 플레이어 너비 조절 가능 */
        opacity: 0.95;
        z-index: 100; /* 다른 요소보다 위에 보이게 설정 */
      }

      .bgm-player {
        width: 100%;
        height: 20px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <!-- 음악 정보 표시 -->
    <div class="music-info">♬ IU(아이유) - 너의 의미 (Feat 김 창완) ♬</div>

    <!-- 오디오 레이어 (자동 재생 및 반복 설정) -->
    <audio controls autoplay loop>
      <source
        src="http://a.tumblr.com/tumblr_ppdua8HFO61xuzllbo1.mp3"
        type="audio/mpeg"
      />
      브라우저가 오디오를 지원하지 않습니다.
    </audio>

    <script>
      // 최근 브라우저는 사용자 클릭 없이 소리가 안 날 수 있어 안내 팝업을 띄울 수 있습니다.
      window.addEventListener(
        'click',
        () => {
          const audio = document.querySelector('audio');
          if (audio.paused) {
            audio.play();
          }
        },
        { once: true },
      );
    </script>
  </body>
</html>
