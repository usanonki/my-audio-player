<!doctype html>

<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <title>Solitude Overlay Sync</title>

    <style>
      html,
      body {
        margin: 0;

        padding: 0;

        height: 100%;

        background: #000;

        overflow: hidden;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* 중요 */
      }

      /* 첫 번째 배경 (기본) */
      .scene::before,
      .scene::after {
        content: '';
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: brightness(0.75) contrast(1.05);
        transition: opacity 1.5s ease-in-out; /* 전환 효과 */
      }

      /* 첫 번째 이미지 */
      .scene::before {
        background-image: url('https://64.media.tumblr.com/8ed85a37714b2c9b7a30049a2355c104/5b45b53ab7558005-bd/s540x810/6aca25a90815010a066dc2b869ebb4b370fc7117.jpg');
        z-index: 1;
      }

      /* 두 번째 이미지 */
      .scene::after {
        background-image: url('https://64.media.tumblr.com/83fe322cae172d517221369ed4f82344/990f4dc307f4616f-a9/s540x810/214191ca2a2dbf7b8e0600dc596c41978b7c48e4.jpg');
        z-index: 2;
        opacity: 0; /* 처음에는 숨김 */
      }

      /* 30초마다 fade 전환 */
      @keyframes backgroundSwitch {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        } /* 15초에 완전히 보임 */
        100% {
          opacity: 0;
        } /* 30초에 다시 사라짐 */
      }

      .scene::after {
        animation: backgroundSwitch 60s infinite linear; /* 60초 주기로 설정 (30초마다 전환) */
      }
      .overlay {
        position: absolute;

        bottom: 12%;

        text-align: center;

        color: #f5f5f5;

        font-family: 'Noto Serif KR', serif;

        text-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
      }

      .overlay p {
        margin: 0.4em 0;

        opacity: 0;

        letter-spacing: 0.06em;

        transition:
          opacity 2s ease-out,
          transform 2s ease-out;
        z-index: 20;
      }

      .overlay p.show {
        opacity: 1;
        transform: translateY(0);
      }

      .overlay p.fadeout {
        opacity: 0 !important;
        transform: translateY(-10px) !important;
        transition:
          opacity 4s ease-in,
          transform 4s ease-in !important;
      }

      /* 오디오 플레이어 위치 */

      audio {
        position: absolute;

        bottom: 20px;

        left: 20px;
        opacity: 0.5;

        width: 250px;
        height: 25px;
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <div class="scene">
      <audio
        id="bgm"
        src="https://blog.kakaocdn.net/dn/cznu2y/btsLbn3pu7g/kPjVQFXGCVGebfQlk5LC7k/tfile.mp3"
        controls
        autoplay
      ></audio>

      <div class="overlay">
        <p class="line1">
          그 고요 속에서 나는 나의 그림자를 바라보고, <br />아무 말도 없이
          저녁이 천천히 스며든다.
        </p>

        <p class="line2">
          희미한 빛 사이로 지나간 시간들이 조용히 되돌아오고, <br />잊었다고
          믿었던 순간들이 다시 나를 스친다.
        </p>

        <p class="line3">
          끝내 닿지 못한 마음 하나가, <br />어둠 깊은 곳에서 아직도 나를 부르고
          있다.
        </p>
      </div>
    </div>

    <script>
      const audio = document.getElementById('bgm');

      const line1 = document.querySelector('.line1');

      const line2 = document.querySelector('.line2');

      const line3 = document.querySelector('.line3');

      // 타이밍 기준 (총 175초)

      const timing = {
        line1_in: 15, // 15초

        line2_in: 30, // 45초 30

        line3_in: 45, // 95초 45

        line3_out: 60, // 160초 60
      };

      // 오디오 재생 시간에 따라 텍스트 상태 변경

      audio.addEventListener('timeupdate', () => {
        const t = audio.currentTime;

        if (t >= timing.line1_in && t < timing.line2_in) {
          line1.classList.add('show');
        }

        if (t >= timing.line2_in && t < timing.line3_in) {
          line2.classList.add('show');
        }

        if (t >= timing.line3_in && t < timing.line3_out) {
          line3.classList.add('show');
        }

        if (t >= timing.line3_out) {
          line3.classList.add('fadeout');
        }
      });
    </script>
  </body>
</html>
