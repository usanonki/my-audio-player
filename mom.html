<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>어머니의 자장가</title>
    <style>
      /* 1. 배경 설정 (다음 카페 스타일 응용) */
      body {
        margin: 0;
        padding: 0;
        background-image:
        /* 1. 가장 위: 부드러운 어두운 그라데이션 오버레이 (인물 보호) */
          linear-gradient(
            to bottom,
            rgba(30, 30, 35, 0.82),
            rgba(30, 30, 35, 0.35) 42%,
            transparent 68%,
            transparent
          ),
          /* 2. GIF 레이어 (필요하다면 경로 수정) */
          url('your-gif-or-second-image.gif'),
          /* ← 여기 GIF 경로 넣으세요. 없으면 이 줄 삭제 */
          /* 3. 메인 배경 이미지 (mom.jpg) */ url('https://usanonki.github.io/photo/mom.jpg');

        background-color: #0e0e0d; /* 기본 어두운 바탕 */
        background-attachment: fixed;
        background-repeat: no-repeat;

        /* 위치와 크기 조정 (그라데이션은 전체 커버, GIF와 사진은 가운데 인물 위주) */
        background-position:
          center,
          /* 그라데이션 */ right 110px bottom -15px,
          /* GIF 위치 (기존 유지) */ center; /* 메인 사진 - 가운데 인물이 잘 보이게 center 추천 */

        background-size:
          100% 100%,
          /* 그라데이션 전체 커버 */ 750px 650px,
          /* GIF 크기 (기존 유지, 필요시 조정) */ cover; /* mom.jpg - 1280x720 사진에 가장 적합 (cover 또는 100% 100%) */

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 2. 영상 영역 (768x432 16:9 규격) */
      .video-container {
        width: 768px;
        height: 432px;
        background: #000;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5); /* 입체감 */
        border-radius: 10px;
        overflow: hidden;
        z-index: 5;
      }

      .ql-video {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* 3. 음악 정보 텍스트 (플레이어 바로 위로 배치) */
      .music-info {
        position: fixed; /* 화면에 고정 */
        left: 13px; /* 오른쪽에서 20px 띄움 */
        bottom: 35px; /* 바닥에서 70px 띄움 (오디오 플레이어 높이만큼 확보) */
        padding: 4px 10px;
        background: rgba(177, 174, 160, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        /* 테두리: 안쪽으로 빛이 들어오는 느낌 */
        border: 2.5px solid rgba(199, 201, 194, 0.76);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        border-radius: 30px;
        color: #a1a138; /* 완전 흰색보다 아주 연한 노란색이 더 고급스러움 */
        font-weight: bold;
        font-size: 0.7em;
        letter-spacing: -0.5px;
        z-index: 100; /* 다른 요소보다 위에 보이게 설정 */
        white-space: nowrap; /* 텍스트 줄바꿈 방지 */
      }

      /* 오디오 컨트롤러 (화면 제일 우측 하단) */
      audio {
        position: fixed; /* 화면에 고정 */
        left: 13px; /* 오른쪽에서 20px 띄움 */
        bottom: 8px; /* 바닥에서 20px 띄움 */
        height: 17px; /* 플레이어 높이 */
        width: 750px; /* 플레이어 너비 조절 가능 */
        opacity: 0.8;
        z-index: 100; /* 다른 요소보다 위에 보이게 설정 */
      /* 배경과 전체적인 느낌 */
        padding: 3px 4px;
        background: rgba(199, 201, 194, 0.65);
        backdrop-filter: blur(20px);
        border-radius: 30px;
      /* 진행바 색상 조정 (가장 중요) */
      accent-color: #b8b5a0;        /* Chrome, Edge, Safari 등에서 진행바 + thumb 색상 */
      }

      filter: sepia(20%) contrast(90%) opacity(0.7); /* 전체적으로 톤을 낮추고 배경과 섞음 */
        mix-blend-mode: multiply; /* 배경색과 자연스럽게 합성 (흰색이 배경색으로 변함) */

      }
    </style>
  </head>
  <body>
    <!-- 음악 정보 표시 -->
    <div class="music-info">
      ♬ 사랑과 평화 - 어머니의 자장가 (이장희 작사,작곡) ♬ ♬
    </div>

    <!-- 오디오 레이어 (자동 재생 및 반복 설정) -->
    <audio controls autoplay>
      <source
        src="https://usanonki.github.io/music/mom.mp3"
        type="audio/mpeg"
      />
      브라우저가 오디오를 지원하지 않습니다.
    </audio>

    <script>
      // 최근 브라우저는 사용자 클릭 없이 소리가 안 날 수 있어 안내 팝업을 띄울 수 있습니다.
      window.addEventListener(
        'click',
        () => {
          const audio = document.querySelector('audio');
          if (audio.paused) {
            audio.play();
          }
        },
        { once: true },
      );
    </script>
  </body>
</html>
